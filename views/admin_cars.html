{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0"><i class="fa-solid fa-car text-orange"></i> Марки и модели</h2>
  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm">Назад</a>
</div>

<div class="row">
  <div class="col-md-4">
    <div class="card card-custom mb-4">
      <div class="card-header card-header-custom">Добавить марку</div>
      <div class="card-body">
        <form method="post" class="d-flex">
          <input type="hidden" name="action" value="add_brand">
          <input name="brand_name" class="form-control me-2" placeholder="Напр. Zeekr" required>
          <button class="btn btn-orange">+</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card card-custom">
      <div class="card-header card-header-custom">Справочник марок</div>
      <div class="card-body">
        {% for b in brands %}
          <div class="border-bottom border-secondary pb-2 mb-2">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h5 class="text-orange mb-0">{{ b.name }}</h5>
              <form method="post" action="{{ url_for('delete_brand', brand_id=b.id) }}" onsubmit="return confirm('Удалить марку и все её модели?');">
                <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
              </form>
            </div>
            <div class="d-flex flex-wrap gap-1 mb-2">
              {% for m in b.models %}
                <span class="badge bg-secondary d-flex align-items-center p-2">
                  {{ m.name }}
                  <form method="post" action="{{ url_for('delete_model', model_id=m.id) }}" class="ms-2 m-0">
                    <button class="btn-close btn-close-white" style="font-size: 0.5rem;"></button>
                  </form>
                </span>
              {% endfor %}
            </div>
            <form method="post" class="d-flex" style="max-width: 300px;">
              <input type="hidden" name="action" value="add_model">
              <input type="hidden" name="brand_id" value="{{ b.id }}">
              <input name="model_name" class="form-control form-control-sm me-1" placeholder="Новая модель..." required>
              <button class="btn btn-sm btn-outline-orange">Добавить</button>
            </form>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
