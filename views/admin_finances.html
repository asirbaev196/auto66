{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2><i class="fa-solid fa-chart-line text-orange"></i> Финансы и выручка</h2>
  <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm">Назад</a>
</div>

<div class="row g-4 mb-4">
  <div class="col-md-6">
    <div class="card card-custom border-success">
      <div class="card-body text-center">
        <h5 class="text-muted">Выручка за всё время</h5>
        <h2 class="text-success fw-bold">{{ total_revenue }} ₽</h2>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card card-custom border-warning">
      <div class="card-body text-center">
        <h5 class="text-muted">Выручка за сегодня</h5>
        <h2 class="text-warning fw-bold">{{ today_total }} ₽</h2>
      </div>
    </div>
  </div>
</div>
{% endblock %}
