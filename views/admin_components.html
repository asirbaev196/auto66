{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="fa-solid fa-list-check text-orange"></i> Справочник компонентов</h2>
<div class="row">
  <div class="col-md-5">
    <div class="card card-custom mb-4">
      <div class="card-header card-header-custom">Добавить</div>
      <div class="card-body">
        <form method="post" class="d-flex">
          <input name="name" class="form-control me-2" placeholder="Название (напр. Колодки)" required>
          <button class="btn btn-orange">Добавить</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-7">
    <div class="card card-custom">
      <div class="card-header card-header-custom">Список</div>
      <div class="card-body p-0">
        {% if components %}
        <table class="table mb-0">
          <tbody>
          {% for c in components %}
            <tr>
              <td class="ps-3 align-middle">{{ c.name }}</td>
              <td class="text-end pe-3">
                <form method="post" action="{{ url_for('delete_component', comp_id=c.id) }}" onsubmit="return confirm('Удалить?');" class="m-0">
                  <button class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-trash"></i></button>
                </form>
              </td>
            </tr>
          {% endfor %}
          </tbody>
        </table>
        {% else %}<p class="text-muted p-3 mb-0">Пусто.</p>{% endif %}
      </div>
    </div>
  </div>
</div>
<div class="mt-4"><a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> Назад</a></div>
{% endblock %}
